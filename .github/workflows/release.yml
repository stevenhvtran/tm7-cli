name: Release

# Publishes a GitHub Release with self-contained NativeAOT binaries for all
# supported platforms. Triggered by pushing a version tag (e.g. `v0.1.0`), or
# manually via the Actions tab (supply the version, e.g. `0.1.0`).
on:
  push:
    tags: ['v*.*.*', '[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release without the leading v (e.g. 0.1.0). Creates a tag at the current commit.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GIT_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [ "$GIT_REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases must be run from 'main' (got '$GIT_REF')."
              exit 1
            fi
          else
            VERSION="$REF_NAME"
          fi
          # Strip an optional leading 'v' (tags are vX.Y.Z; a manual input may include it).
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$VERSION' is not valid semver (expected e.g. 0.1.0 or 0.1.0-rc.1)."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  build:
    name: Build ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Each RID is built natively on a runner of the matching architecture,
        # so no cross-compilation toolchain is required.
        include:
          - { rid: win-x64,     runner: windows-latest }
          - { rid: win-arm64,   runner: windows-11-arm }
          - { rid: linux-x64,   runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: osx-x64,     runner: macos-15-intel }
          - { rid: osx-arm64,   runner: macos-15 }

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang graphviz zlib1g-dev

      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install graphviz --yes --no-progress

      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install graphviz

      - name: Publish native asset
        shell: pwsh
        run: ./scripts/Publish-NativeAsset.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version '${{ needs.prepare.outputs.version }}' -ArtifactsDirectory './artifacts/release'

      - name: Smoke-test packaged binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.prepare.outputs.version }}'
          $dir = Join-Path $env:RUNNER_TEMP "smoke-$rid"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          if ($rid -like 'win-*') {
              Expand-Archive -Path "./artifacts/release/tm7-$rid.zip" -DestinationPath $dir -Force
              $exe = Join-Path $dir 'tm7.exe'
          }
          else {
              tar -xzf "./artifacts/release/tm7-$rid.tar.gz" -C $dir
              $exe = Join-Path $dir 'tm7'
              & chmod '+x' $exe
          }

          $actual = (& $exe --version).Trim()
          Write-Host "tm7 --version => $actual"
          # The .NET SDK appends '+<commit-sha>' to the informational version;
          # compare only the version part before the build metadata.
          $actualBase = $actual.Split('+')[0]
          if ($actualBase -ne $version) {
              throw "Version mismatch: expected '$version' but binary reported '$actualBase'."
          }

          # Functional smoke: exercise the bundled template, Graphviz process invocation,
          # DataContractSerializer round-trip, and terminal rendering under NativeAOT.
          $model = Join-Path $dir 'smoke.tm7'
          & $exe new $model --name 'Smoke Test'
          if ($LASTEXITCODE -ne 0) { throw "tm7 new failed (exit $LASTEXITCODE)." }
          & $exe add entity $model --name 'Smoke API' --type-id GE.P --generic-type-id GE.P
          if ($LASTEXITCODE -ne 0) { throw "tm7 add entity failed (exit $LASTEXITCODE)." }
          & $exe open $model
          if ($LASTEXITCODE -ne 0) { throw "tm7 open failed (exit $LASTEXITCODE)." }
          $rendered = (& $exe render $model --plain | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "tm7 render failed (exit $LASTEXITCODE)." }
          if (-not $rendered.Contains('Smoke API')) {
            throw 'tm7 render output did not contain the smoke-test entity.'
          }
          Write-Host 'Functional smoke passed (new + Graphviz layout + open + render).'

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: ./artifacts/release/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: ./artifacts/input
          merge-multiple: true

      - name: Assemble release bundle
        shell: pwsh
        run: ./scripts/New-ReleaseBundle.ps1 -InputDirectory './artifacts/input' -OutputDirectory './artifacts/release' -Version '${{ needs.prepare.outputs.version }}' -ExpectedAssetCount 6

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          # Tag semver pre-releases (e.g. 0.1.0-rc.1) as GitHub pre-releases.
          PRERELEASE_FLAG=()
          case "$VERSION" in
            *-*) PRERELEASE_FLAG+=(--prerelease) ;;
          esac

          NOTES=$(cat <<EOF
          ## tm7 ${VERSION}

          Self-contained NativeAOT binaries for Windows, Linux, and macOS (x64 and arm64).

          - Graphviz is required for layout-backed commands; see the bundled README for installation instructions.
          - Verify downloads against \`checksums.txt\` (SHA-256).
          - Asset details are listed in \`release-metadata.json\`.
          EOF
          )

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating metadata and uploading/clobbering assets."
            gh release edit "$TAG" --repo "$REPO" --title "$TAG" --notes "$NOTES" "${PRERELEASE_FLAG[@]}"
            gh release upload "$TAG" ./artifacts/release/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" ./artifacts/release/* \
              --repo "$REPO" \
              --target "$COMMIT" \
              --title "$TAG" \
              --notes "$NOTES" \
              "${PRERELEASE_FLAG[@]}"
          fi

          echo "## Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published assets:" >> "$GITHUB_STEP_SUMMARY"
          for f in ./artifacts/release/*; do
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done
